[project]
name = "docqa"
version = "0.1.0"
description = "Upload large PDFs and ask questions about them (RAG with LangChain, Gemini and pgvector)."
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.156.1",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.32",
    "sse-starlette==3.5.0",
    "pydantic-settings==2.16.1",
    # 2.1 is not yet supported by opentelemetry-instrumentation-sqlalchemy
    "sqlalchemy[asyncio]==2.0.55",
    "psycopg[binary,pool]==3.3.6",
    "pgvector==0.5.1",
    "alembic==1.20.0",
    "pymupdf==1.26.7",
    "langchain-core==1.6.12",
    "langchain-text-splitters==1.1.3",
    "langchain-google-genai==4.4.2",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.1",
    "opentelemetry-instrumentation-fastapi==0.66b1",
    "opentelemetry-instrumentation-sqlalchemy==0.66b1",
    # Transitive pin: CVE-2026-63374 is fixed in anyio 4.14.2.
    "anyio==4.14.2",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[project.scripts]
docqa-api = "docqa.main:run"
docqa-worker = "docqa.worker:run"
docqa-migrate = "docqa.db:migrate"

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a live Postgres with pgvector (DATABASE_URL)"]
