global:
  platform: openshift
cni:
  # CRI-O on MicroShift loads plugins only from /run/cni/bin and configs from /etc/cni/net.d.
  cniBinDir: /run/cni/bin
  cniConfDir: /etc/cni/net.d
  chained: true
  # Chain into the conflist the bootstrap init container creates (see kustomization.yaml).
  # istio-cni converts a single-plugin .conf into a list named "k8s-pod-network" at spec 0.3.1,
  # which CRI-O on MicroShift rejects as the default network; a pre-made .conflist that keeps
  # OVN's name and spec version avoids that conversion entirely.
  cniConfFileName: "00-ovn-kubernetes.conflist"
  provider: default
  privileged: true
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      cpu: 200m
      memory: 128Mi
