apiVersion: v1
kind: Service
metadata:
  name: docqa-api
  labels:
    app: docqa-api
spec:
  selector:
    app: docqa-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docqa-api
  labels:
    app: docqa-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docqa-api
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: docqa-api
        version: v1
    spec:
      serviceAccountName: docqa-api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: docker.io/dudakovict/docqa
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: docqa-config
            - secretRef:
                name: docqa-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: docqa-postgres
                  key: database-url
            - name: OTEL_SERVICE_NAME
              value: docqa-api
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi   # multipart uploads spill here before being read into the row
