# One identity per workload. Istio issues each its own SPIFFE certificate, which the
# AuthorizationPolicies below use to say who may talk to whom.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: docqa-api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: docqa-worker
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: docqa-postgres
automountServiceAccountToken: false
