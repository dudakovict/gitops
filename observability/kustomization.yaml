apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - istio.yaml
  - networkpolicy.yaml
# Generated with a content hash in its name, so a config change rolls the Deployment.
configMapGenerator:
  - name: otel-collector
    files:
      - collector.yaml
